<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — K-Print</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2f3542;
            --accent: #26de81;
            --bg: #f1f2f6;
            --white: #ffffff;
            --text: #2f3542;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --danger: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-weight: 400;
        }

        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        }
        .nav-container {
            max-width: 1300px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px;
        }
        .logo {
            font-size: 26px; font-weight: 800; color: var(--primary);
            text-decoration: none; letter-spacing: -1px;
        }
        .logo span { color: var(--accent); font-weight: 300; }
        nav ul {
            list-style: none; display: flex; gap: 10px;
            margin: 0; padding: 0; align-items: center;
        }
        nav ul li a {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: var(--primary); font-weight: 600; font-size: 12px;
            width: 78px; height: 72px; border-radius: 14px;
            background-color: transparent; text-align: center; gap: 5px; transition: 0.2s;
        }
        nav ul li a .nav-icon { font-size: 26px; line-height: 1; }
        nav ul li a:hover { background-color: #f0f0f0; color: var(--accent); }
        nav ul li a.active { background-color: var(--primary); color: white; }
        nav ul li a.active .nav-icon { color: var(--accent); }
        .login-btn { background-color: var(--accent) !important; color: white !important; }
        .login-btn:hover { background-color: #20bf6b !important; }

        .burger {
            display: none; flex-direction: column; gap: 5px;
            cursor: pointer; background: none; border: none; padding: 10px;
        }
        .burger span {
            width: 26px; height: 3px; background: var(--primary);
            border-radius: 3px; transition: 0.3s;
        }

        .main-content {
            margin-top: 100px; max-width: 800px;
            margin-left: auto; margin-right: auto; padding: 20px;
        }

        .profile-card {
            background: var(--white); border-radius: 20px;
            padding: 40px; box-shadow: var(--shadow); margin-bottom: 20px;
        }
        .profile-header {
            display: flex; align-items: center; gap: 25px;
            margin-bottom: 40px; border-bottom: 1px solid #f1f2f6; padding-bottom: 30px;
        }
        .avatar-circle {
            width: 80px; height: 80px; background: var(--accent); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 700;
        }
        .user-meta h2 { margin: 0; font-size: 24px; font-weight: 700; }
        .user-meta p { margin: 5px 0 0 0; color: #747d8c; font-weight: 300; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label {
            font-size: 12px; font-weight: 600; color: #747d8c;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .input-group input {
            padding: 12px 14px; border: 1px solid #dfe4ea; border-radius: 10px;
            font-size: 15px; background: #f9f9fb; font-family: inherit; font-weight: 400;
        }

        .stats-row { display: flex; gap: 20px; margin-top: 40px; }
        .stat-box {
            flex: 1; background: #f1f2f6; padding: 20px;
            border-radius: 15px; text-align: center;
        }
        .stat-box span { display: block; font-size: 24px; font-weight: 800; color: var(--primary); }
        .stat-box label {
            font-size: 11px; color: #747d8c; text-transform: uppercase;
            font-weight: 600; letter-spacing: 0.5px;
        }

        .btn-save {
            margin-top: 30px; background: var(--primary); color: white;
            border: none; padding: 15px 30px; border-radius: 12px;
            font-weight: 600; cursor: pointer; width: 100%; transition: 0.3s;
            font-family: inherit; font-size: 15px;
        }
        .btn-save:hover { background: #3d4454; }
        .logout-link {
            display: block; text-align: center; margin-top: 20px;
            color: var(--danger); text-decoration: none; font-weight: 600; font-size: 14px;
        }
        .logout-link:hover { opacity: 0.8; }

        /* МАКЕТЫ */
        .designs-card {
            background: var(--white); border-radius: 20px;
            padding: 30px; box-shadow: var(--shadow);
        }
        .designs-card h3 {
            font-size: 20px; font-weight: 700; margin-bottom: 20px;
            display: flex; align-items: center; gap: 8px;
        }
        .designs-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .design-item {
            border: 1px solid #e0e0e0; border-radius: 12px;
            padding: 16px; transition: 0.2s;
        }
        .design-item:hover { border-color: var(--accent); }
        .design-item .design-preview {
            width: 100%; height: 100px; background: #f5f5f5;
            border-radius: 8px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #ccc;
        }
        .design-item .design-name {
            font-weight: 600; font-size: 14px; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .design-item .design-size {
            font-size: 12px; color: #747d8c; font-weight: 300; margin-bottom: 10px;
        }
        .design-item .design-actions {
            display: flex; gap: 8px;
        }
        .design-item .design-actions button {
            flex: 1; padding: 7px 0; border-radius: 6px;
            font-size: 11px; font-weight: 600; cursor: pointer; border: none;
            font-family: inherit; transition: 0.2s;
        }
        .btn-edit { background: var(--accent); color: white; }
        .btn-edit:hover { background: #20bf6b; }
        .btn-delete { background: #f5f5f5; color: var(--danger); }
        .btn-delete:hover { background: #ffe0e0; }

        .no-designs {
            text-align: center; padding: 30px; color: #aaa;
            font-weight: 300; font-size: 14px;
        }

        footer { text-align: center; padding: 40px; color: #a4b0be; font-size: 13px; font-weight: 300; }

        @media (max-width: 768px) {
            .nav-container { flex-wrap: wrap; }
            nav ul { display: none; flex-direction: column; width: 100%; gap: 4px; margin-top: 10px; }
            nav ul.show { display: flex; }
            nav ul li a { width: 100%; height: 44px; flex-direction: row; gap: 8px; font-size: 13px; justify-content: flex-start; padding-left: 14px; }
            nav ul li a .nav-icon { font-size: 20px; }
            .burger { display: flex; }
            .main-content { margin-top: 130px; }
            .info-grid { grid-template-columns: 1fr; }
            .stats-row { flex-direction: column; }
            .designs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <a href="index.html" class="logo">K-<span>PRINT</span></a>
        <button class="burger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
        <nav>
            <ul id="navList">
                <li><a href="index.html"><span class="nav-icon">🏠</span> Главная</a></li>
                <li><a href="calc.html"><span class="nav-icon">📐</span> Калькулятор</a></li>
                <li><a href="designer.html"><span class="nav-icon">🎨</span> Редактор</a></li>
                <li><a href="orders.html"><span class="nav-icon">📋</span> Заказы</a></li>
                <li><a href="about.html"><span class="nav-icon">ℹ️</span> О нас</a></li>
                <li><a href="profile.html" class="active"><span class="nav-icon">👤</span> Профиль</a></li>
                <li><a href="login.html" class="login-btn"><span class="nav-icon">🔑</span> Вход</a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="main-content">
    <!-- Личные данные -->
    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar-circle">ИП</div>
            <div class="user-meta">
                <h2>Личный кабинет</h2>
                <p>Клиент № 2026-AF</p>
            </div>
        </div>
        <div class="info-grid">
            <div class="input-group"><label>Ваше имя</label><input type="text" value="Иван Петров"></div>
            <div class="input-group"><label>Телефон</label><input type="text" value="+7 (999) 000-00-00"></div>
            <div class="input-group"><label>Email</label><input type="email" value="hello@kprint.ru"></div>
            <div class="input-group"><label>Город доставки</label><input type="text" value="Краснодар"></div>
        </div>
        <div class="stats-row">
            <div class="stat-box"><span>12</span><label>Заказов сделано</label></div>
            <div class="stat-box"><span>24 500 ₽</span><label>Сумма покупок</label></div>
        </div>
        <button class="btn-save">Сохранить изменения</button>
        <a href="#" class="logout-link">Выйти из аккаунта</a>
    </div>

    <!-- Мои макеты -->
    <div class="designs-card">
        <h3>🎨 Мои макеты</h3>
        <div class="designs-grid" id="designsGrid">
            <div class="no-designs">Нет сохранённых макетов</div>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 K-Print — Ваш личный кабинет
</footer>

<script>
    function loadDesigns() {
        const grid = document.getElementById('designsGrid');
        const designs = JSON.parse(localStorage.getItem('kprintDesigns') || '[]');

        if (designs.length === 0) {
            grid.innerHTML = '<div class="no-designs">Нет сохранённых макетов</div>';
            return;
        }

        grid.innerHTML = designs.map((d, i) => `
            <div class="design-item">
                <div class="design-preview">🎨</div>
                <div class="design-name">${d.name}</div>
                <div class="design-size">${d.width} × ${d.height} мм</div>
                <div class="design-actions">
                    <button class="btn-edit" onclick="editDesign(${i})">✏️ Ред.</button>
                    <button class="btn-delete" onclick="deleteDesign(${i})">🗑 Удалить</button>
                </div>
            </div>
        `).join('');
    }

    function editDesign(index) {
        const designs = JSON.parse(localStorage.getItem('kprintDesigns') || '[]');
        const design = designs[index];
        if (!design) return alert('Макет не найден');

        // Передаём данные в редактор через sessionStorage
        sessionStorage.setItem('kprintEditDesign', JSON.stringify(design));
        window.location.href = 'designer.html';
    }

    function deleteDesign(index) {
        if (!confirm('Удалить этот макет?')) return;
        const designs = JSON.parse(localStorage.getItem('kprintDesigns') || '[]');
        designs.splice(index, 1);
        localStorage.setItem('kprintDesigns', JSON.stringify(designs));
        loadDesigns();
    }

    function toggleMenu() {
        document.getElementById('navList').classList.toggle('show');
    }

    // Загрузка при открытии
    loadDesigns();
</script>

</body>
</html>
