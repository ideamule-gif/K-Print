<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — K-Print</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2f3542;
            --accent: #26de81;
            --bg: #f1f2f6;
            --white: #ffffff;
            --text: #2f3542;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-weight: 400;
        }

        /* МЕНЮ */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -1px;
        }

        .logo span { color: var(--accent); font-weight: 300; }

        nav ul {
            list-style: none;
            display: flex;
            gap: 10px;
            margin: 0; padding: 0;
            align-items: center;
        }

        nav ul li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 12px;
            transition: 0.2s;
            width: 78px;
            height: 72px;
            border-radius: 14px;
            background-color: transparent;
            text-align: center;
            gap: 5px;
        }

        nav ul li a .nav-icon { font-size: 26px; line-height: 1; }

        nav ul li a:hover { background-color: #f0f0f0; color: var(--accent); }

        nav ul li a.active { background-color: var(--primary); color: white; }
        nav ul li a.active .nav-icon { color: var(--accent); }

        .login-btn { background-color: var(--accent) !important; color: white !important; }
        .login-btn:hover { background-color: #20bf6b !important; }
        .login-btn.active { background-color: #20bf6b !important; }

        /* ФОРМА */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin-top: 100px;
        }

        .auth-card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 25px;
            box-shadow: var(--shadow);
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #f1f2f6;
        }

        .tab {
            padding-bottom: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #a4b0be;
            transition: 0.3s;
            font-size: 15px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom: 3px solid var(--accent);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #747d8c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dfe4ea;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 400;
            background: #f9f9fb;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-family: inherit;
        }

        .btn-submit:hover { background: #3d4454; transform: translateY(-2px); }

        .hidden { display: none; }

        .social-login {
            text-align: center;
            margin-top: 25px;
            border-top: 1px solid #f1f2f6;
            padding-top: 20px;
        }

        .social-login p { font-size: 12px; color: #a4b0be; font-weight: 300; }

        .tg-auth {
            display: inline-block;
            text-decoration: none;
            color: #0088cc;
            font-weight: 600;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #a4b0be;
            font-size: 13px;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 10px; }
            nav ul { flex-wrap: wrap; gap: 6px; justify-content: center; }
            nav ul li a { width: 68px; height: 64px; font-size: 11px; }
            nav ul li a .nav-icon { font-size: 24px; }
            .auth-wrapper { margin-top: 140px; }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <a href="index.html" class="logo">K-<span>PRINT</span></a>
        <nav>
            <ul>
                <li><a href="index.html">
                    <span class="nav-icon">🏠</span> Главная
                </a></li>
                <li><a href="calc.html">
                    <span class="nav-icon">📐</span> Калькулятор
                </a></li>
                <li><a href="designer.html">
                    <span class="nav-icon">🎨</span> Редактор
                </a></li>
                <li><a href="orders.html">
                    <span class="nav-icon">📋</span> Заказы
                </a></li>
                <li><a href="about.html">
                    <span class="nav-icon">ℹ️</span> О нас
                </a></li>
                <li><a href="profile.html">
                    <span class="nav-icon">👤</span> Профиль
                </a></li>
                <li><a href="login.html" class="login-btn active">
                    <span class="nav-icon">🔑</span> Вход
                </a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="tabs">
            <div id="tab-login" class="tab active" onclick="switchTab('login')">Вход</div>
            <div id="tab-reg" class="tab" onclick="switchTab('reg')">Регистрация</div>
        </div>

        <form id="form-login" action="profile.html">
            <div class="form-group">
                <label>Email или Телефон</label>
                <input type="text" placeholder="example@mail.ru" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Войти в K-Print</button>
        </form>

        <form id="form-reg" class="hidden" action="profile.html">
            <div class="form-group">
                <label>Как вас зовут?</label>
                <input type="text" placeholder="Иван Иванов" required>
            </div>
            <div class="form-group">
                <label>Ваш Email</label>
                <input type="email" placeholder="example@mail.ru" required>
            </div>
            <div class="form-group">
                <label>Придумайте пароль</label>
                <input type="password" placeholder="Мин. 6 символов" required>
            </div>
            <button type="submit" class="btn-submit" style="background: var(--accent);">Создать аккаунт</button>
        </form>

        <div class="social-login">
            <p>Или войти через</p>
            <a href="#" class="tg-auth">Telegram</a>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 K-Print — Типография будущего
</footer>

<script>
    function switchTab(type) {
        const loginForm = document.getElementById('form-login');
        const regForm = document.getElementById('form-reg');
        const loginTab = document.getElementById('tab-login');
        const regTab = document.getElementById('tab-reg');

        if (type === 'login') {
            loginForm.classList.remove('hidden');
            regForm.classList.add('hidden');
            loginTab.classList.add('active');
            regTab.classList.remove('active');
        } else {
            loginForm.classList.add('hidden');
            regForm.classList.remove('hidden');
            loginTab.classList.remove('active');
            regTab.classList.add('active');
        }
    }
</script>

</body>
</html>
